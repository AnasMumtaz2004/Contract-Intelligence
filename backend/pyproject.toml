[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.2",
    "httptools>=0.6.0",
    "langchain-community==0.3.31",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "python-multipart>=0.0.20",
    "pytesseract>=0.3.13",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "ruff",
    "sentence-transformers>=6.2.0",
    "torch",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.34.0",
    "watchfiles>=1.0.0",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
eval = [
    "langchain-huggingface>=1.2.3",
    "ragas>=0.4.3",
]
